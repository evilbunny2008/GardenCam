plugins {
    id 'com.android.application'
}

android {
    compileSdk = 37

    defaultConfig {
        applicationId 'com.odiousapps.gardencam'
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName '0.0.1'
        base.archivesName = 'gardencam'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
    }
    packaging {
        resources.excludes.add('META-INF/versions/9/OSGI-INF/MANIFEST.MF')
        jniLibs {
            useLegacyPackaging true
        }
    }
    // Only arm64-v8a is supported.
    // AABs are split per device by Play; ABI splits plus resource shrinking break bundleRelease,
    // so bundles restrict ABIs via ndk.abiFilters (which can't be combined with ABI splits).
    def isBundle = gradle.startParameter.taskNames.any { it.toLowerCase().contains('bundle') }
    if (isBundle) {
        defaultConfig.ndk.abiFilters 'arm64-v8a'
    }
    splits {
        abi {
            enable !isBundle
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }
    namespace 'com.odiousapps.gardencam'
    buildToolsVersion '37.0.0'
    // Needed so AGP can strip debug symbols from native libs (libc++_shared.so ships unstripped)
    ndkVersion '29.0.14206865'
}

// Unique versionCode per architecture for F-Droid: versionCode * 10 + ABI digit.
// Outputs without an ABI filter (App Bundles) get digit 0; 64-bit ABIs rank above 32-bit ones.
def abiVersionCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86': 3, 'x86_64': 4]

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find { it.filterType.name() == 'ABI' }?.identifier
            output.versionCode.set(output.versionCode.get() * 10 + (abi != null ? abiVersionCodes[abi] : 0))
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'

    // Custom libvlc 3.7.7 built from ~/AndroidStudioProjects/vlc-android (arm64-v8a only)
    implementation files('libs/libvlc.aar')
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'com.github.mwiede:jsch:2.28.8'
    
    // ONVIF dependencies
    implementation 'org.apache.httpcomponents:httpclient-android:4.3.5.1'
}
