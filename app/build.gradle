plugins {
    id 'com.android.application'
}

android {
    compileSdk = 37

    defaultConfig {
        applicationId 'com.odiousapps.onvifcamera'
        minSdk 24
        targetSdk 37
        versionCode 10101388
        versionName '2.5.3'
        base.archivesName = 'cams'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
    }
    packaging {
        resources.excludes.add('META-INF/versions/9/OSGI-INF/MANIFEST.MF')
        jniLibs {
            useLegacyPackaging true
        }
    }
    splits {
        abi {
            // AABs are split per device by Play; ABI splits plus resource shrinking break bundleRelease
            enable !gradle.startParameter.taskNames.any { it.toLowerCase().contains('bundle') }
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64', 'x86'
            universalApk false
        }
    }
    namespace 'com.vladpen.cams'
    buildToolsVersion '37.0.0'
}

// Assign different versionCodes per architecture for F-Droid
def abiVersionCodes = ['armeabi-v7a': -3, 'arm64-v8a': -2, 'x86': -1, 'x86_64': 0]

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find { it.filterType.name() == 'ABI' }?.identifier
            if (abi != null) {
                output.versionCode.set(output.versionCode.get() + abiVersionCodes[abi])
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'

    implementation 'org.videolan.android:libvlc-all:3.7.7'
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'com.github.mwiede:jsch:2.28.8'
    
    // ONVIF dependencies
    implementation 'org.apache.httpcomponents:httpclient-android:4.3.5.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
